name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, unit tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Lint the app
        run: pnpm --filter @tilltide/seeker-app exec expo lint

  e2e:
    name: End-to-end (local Solana validator + Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tilltide
          POSTGRES_PASSWORD: tilltide
          POSTGRES_DB: tilltide
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tilltide"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the Solana CLI (same version as development)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v4.0.3/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Run the end-to-end suite
        run: pnpm --filter @tilltide/agent e2e
        env:
          E2E_ADMIN_DATABASE_URL: postgres://tilltide:tilltide@localhost:5432/tilltide
