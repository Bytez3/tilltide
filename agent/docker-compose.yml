# Local Postgres for development. Railway provides DATABASE_URL in production.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: tilltide
      POSTGRES_PASSWORD: tilltide
      POSTGRES_DB: tilltide
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
